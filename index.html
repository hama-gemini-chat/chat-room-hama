<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Chat</title>
<style>
body { font-family: sans-serif; margin: 0; background: #f2f4f7; display: flex; flex-direction: column; height: 100vh; }
header { background: #1a73e8; color: #fff; padding: 14px; font-weight: bold; text-align: center; }
#messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
.user { background: #dcf8c6; align-self: flex-start; }
.ai { background: #ffffff; align-self: flex-end; border: 1px solid #ddd; }
.meta { font-size: 11px; color: #666; margin-bottom: 4px; }
form { display: flex; gap: 8px; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
button { padding: 10px 16px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<header>ژووری چاتی Gemini</header>
<div id="messages"></div>
<form id="chat-form">
<input id="msg-input" type="text" placeholder="پەیامێک بنووسە (بۆ جیمینی بە @ai دەست پێبکە)..." required />
<button type="submit">ناردن</button>
</form>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyB_FUxWu5EOwv21rYjOIThBHvXzGPE3TTU",
authDomain: "gemini-chat-68f1e.firebaseapp.com",
databaseURL: "https://gemini-chat-68f1e-default-rtdb.firebaseio.com",
projectId: "gemini-chat-68f1e",
storageBucket: "gemini-chat-68f1e.firebasestorage.app",
messagingSenderId: "49197496296",
appId: "1:49197496296:web:ed625769d3570e1543965d",
measurementId: "G-ZWGWKRNRLH"
};

const GEMINI_API_KEY = "AQ.Ab8RN6LxW0nhMAz1wGiVqWbJkYN-fYcnidUB5Ue2ex9piAr6dA";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = ref(db, "rooms/main/messages");

const messagesDiv = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("msg-input");

function renderMessage(data) {
const div = document.createElement("div");
div.className = msg ${data.sender === "Gemini" ? "ai" : "user"}; div.innerHTML =<div class="meta">${data.sender}&lt;/div&gt;&lt;div&gt;${data.text}</div>`;
messagesDiv.appendChild(div);
messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

onChildAdded(messagesRef, (snapshot) => {
renderMessage(snapshot.val());
});

async function askGemini(promptText) {
const res = await fetch(
https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`,
{
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
contents: [{ parts: [{ text: promptText }] }]
})
}
);
const json = await res.json();
return json?.candidates?.[0]?.content?.parts?.[0]?.text || "وەڵامێک نەهاتەوە.";
}

form.addEventListener("submit", async (e) => {
e.preventDefault();
const text = input.value.trim();
if (!text) return;
input.value = "";

await push(messagesRef, { sender: "من", text, time: Date.now() });

if (text.startsWith("@ai")) {
const cleanPrompt = text.replace(/^@ai\s*/i, "");
const reply = await askGemini(cleanPrompt);
await push(messagesRef, { sender: "Gemini", text: reply, time: Date.now() });
}
});
</script>
</body>
</html>
